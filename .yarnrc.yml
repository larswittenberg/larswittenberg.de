approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

# Verhindert die Installation von Paketen, die vor weniger als 24 Stunden veröffentlicht wurden
# https://yarnpkg.com/features/security#age-gate
npmMinimalAgeGate: 24h

# Erlaubt nur die Installation von vorab genehmigten Paketen
npmPreapprovedPackages:
  - "next"
  - "@next/*"
  - "eslint-config-next"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
